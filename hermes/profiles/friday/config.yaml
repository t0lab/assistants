# Hermes Agent — config cho profile "friday" (bot Telegram group, least-privilege).
# Agent tên "Friday" (bot group); bot owner full-quyền tên "Jarvis" ở default profile.
# Symlink vào ~/.hermes/profiles/friday/config.yaml qua install/link-home.sh.
# Secrets (token bot #2, OPENAI_API_KEY) ở ~/.hermes/profiles/friday/.env — KHÔNG ở đây.
# Quyết định + lý do: ../../../docs/design-docs/telegram-group-bot.md (ADR).
#
# ⚠️ AN TOÀN: profile này KHÔNG được nạp tool leak key / execute / điều khiển thiết bị.
#    Lớp chặn cứng = agent.disabled_toolsets (dưới); KHÔNG khai mcp_servers ở đây.

# Model dùng chung LiteLLM proxy như default profile (xem ../../home/config.yaml).
providers:
  litellm:
    base_url: "https://litellm-horseai.everlearners.io/v1"
    key_env: OPENAI_API_KEY                       # đọc từ ~/.hermes/profiles/friday/.env
    default_model: "openai/Qwen/Qwen3.6-35B-A3B"

model:
  provider: litellm
  default: "openai/Qwen/Qwen3.6-35B-A3B"

# Termux: tắt lazy pip-install (C-ext fail trên Android → treo API). Như default profile.
security:
  allow_lazy_installs: false

# ── TOOLSET: least-privilege ─────────────────────────────────────────────────
# Lớp CHẶN CỨNG (denylist) — áp SAU mọi per-platform config, không platform nào
# override được (kể cả cronjob.enabled_toolsets — cần verify G7). Mọi toolset đọc
# file/env (lộ key), execute, hoặc điều khiển tài khoản/thiết bị khác đều ở đây.
# ĐỪNG gỡ mục nào nếu chưa đọc ADR.
agent:
  # CHỈ 6 toolset được BẬT: web, search, cronjob, clarify, todo, vision.
  # Denylist dưới = MỌI toolset còn lại trong catalog Hermes (allowlist-qua-denylist) →
  # an toàn KHÔNG phụ thuộc bước `hermes tools` on-device. Re-audit khi nâng cấp Hermes
  # (tool mới có thể default-on → thêm vào đây). Tên xác nhận theo `hermes -p friday tools`.
  disabled_toolsets:
    # — leak key / execute / điều khiển thiết bị (TUYỆT ĐỐI không gỡ) —
    - terminal          # shell execution
    - code_execution    # chạy code
    - file              # đọc/ghi/sửa file → cat .env lộ key
    - browser           # browser automation → mở file://…/.env hoặc SSRF localhost = lộ key
    - debugging         # bundle file + process/terminal + web
    - computer_use      # điều khiển desktop
    - memory            # đọc/ghi memory trên đĩa
    - session_search    # đọc hội thoại cũ (có thể lộ secret)
    - skills            # CRUD skill (vector chèn instruction/code)
    - delegation        # spawn subagent (có thể escalate quyền)
    # — điều khiển tài khoản khác của owner —
    - messaging
    - discord
    - discord_admin
    - spotify
    - homeassistant
    - feishu_doc
    - feishu_drive
    - yuanbao
    # — cost/abuse, không cần cho Q&A group (khoá để allowlist chặt) —
    - image_gen
    - video_gen
    - tts
    - moa
    - kanban
    - video
    - x_search
    - safe              # bundle read-only+media — tránh re-enable ngầm (đã có web/search/vision)
#
# ⚠️ KHÔNG khai mcp_servers (đặc biệt KHÔNG `device`) — bot công khai không chạm phone.

# ── TELEGRAM: chỉ phục vụ group, bắt buộc @mention ───────────────────────────
# Keys phải đúng path gateway.platforms.telegram.extra (đặt sai cấp → bị drop âm thầm).
# Token bot #2 ở .env (TELEGRAM_BOT_TOKEN); chat-id KHÔNG phải secret nên để ở đây (auditable).
gateway:
  platforms:
    telegram:
      extra:
        require_mention: true              # chỉ trả lời khi @mention / reply / slash command
        group_allowed_chats:
          - "REPLACE_WITH_GROUP_CHAT_ID"   # -100… ; lấy qua @userinfobot / forward 1 tin vào @JsonDumpBot
        # group_allow_from: ["*"]          # mặc định: mọi thành viên trong group trên đều dùng được
