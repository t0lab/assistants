# Hermes Agent — config (KHÔNG secret). Symlink vào ~/.hermes/config.yaml qua install/link-home.sh.
# API key KHÔNG ở đây — đặt OPENAI_API_KEY trong ~/.hermes/.env (xem ../.env.example).

# LiteLLM proxy (OpenAI-compatible) khai báo dạng NAMED provider block.
# Vì sao không dùng thẳng `provider: custom`: với 'custom', Hermes suy tên biến key
# từ host của base_url (litellm-horseai.everlearners.io → EVERLEARNERS_API_KEY), KHÔNG đọc
# OPENAI_API_KEY → gửi "no-key-required" → 401. Named block + key_env cho phép trỏ rõ
# vào OPENAI_API_KEY chuẩn trong .env. (Xem hermes_cli/runtime_provider.py.)
providers:
  litellm:
    base_url: "https://litellm-horseai.everlearners.io/v1"
    key_env: OPENAI_API_KEY                       # đọc key (sk-...) từ ~/.hermes/.env
    default_model: "openai/Qwen/Qwen3.6-35B-A3B"  # phải khớp id trong /v1/models của proxy
    # context_length: 131072   # bỏ comment nếu proxy KHÔNG expose /v1/models

model:
  provider: litellm                               # trỏ tới block ở trên
  default: "openai/Qwen/Qwen3.6-35B-A3B"          # đổi nếu proxy đổi model

# Termux: TẮT lazy pip-install lúc chạy. Backend như discord.py[voice]/brotlicffi (C-ext)
# build FAIL trên Android → Hermes thử cài lại mỗi lần liệt kê tool → block + chậm API
# (cả gateway lẫn dashboard). Cần backend nào thì cài tay trong venv.
security:
  allow_lazy_installs: false

# Web search backend cho toolset `web` (web_search). Endpoint = SEARXNG_URL trong .env
# (SearXNG self-host qua NetBird — xem searxng/ + ADR search-backend-searxng.md).
# Hermes có auto-detect (SEARXNG_URL set → tự chọn searxng) nhưng khai explicit cho chắc + config-as-code.
# Giá trị "searxng" lấy từ source: plugins/web/searxng/provider.py (SearXNGWebSearchProvider.name).
web:
  search_backend: searxng

# MCP servers
mcp_servers:
  # Điều khiển thiết bị (no-root) qua Shizuku/rish — xem hermes/mcp/ + ADR device-control-via-adb.
  # Đường dẫn tuyệt đối trên phone (repo ở ~/t0lab/assistants). Cần `pip install -r hermes/mcp/requirements.txt`
  # trong venv Hermes, và Shizuku đã kích hoạt (rish chạy được). Đổi backend qua HERMES_DEVICE_BACKEND.
  device:
    # PHẢI là python tuyệt đối của venv (chứa `mcp`). Gateway do boot.sh chạy với PATH tối thiểu
    # → `python3` trần = python hệ thống KHÔNG có mcp → server crash, agent mất tool.
    command: /data/data/com.termux/files/home/.hermes/hermes-agent/venv/bin/python3
    args: ["/data/data/com.termux/files/home/t0lab/assistants/hermes/mcp/server.py"]
    env:
      HERMES_DEVICE_BACKEND: "rish"   # rish (Shizuku) | adb (self-ADB fallback)
      RISH_APPLICATION_ID: "com.termux"  # rish cần biết app gọi (Termux); .bashrc không áp cho process spawn

  # root: (phase sau, khi máy đã root) — chạy lệnh đặc quyền qua `su -c`, xem mcp-root/
  # root:
  #   command: python
  #   args: ["-m", "mcp_root"]
